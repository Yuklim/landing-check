<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Check · 识别测试台</title>
<style>
  body{font-family:-apple-system,Inter,"PingFang SC",sans-serif;margin:0;background:#F0F2F5;color:#121826}
  main{max-width:960px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{background:#fff;border-radius:12px;padding:18px;border:1px solid #DADFE6}
  h1{font-size:18px;margin:0 0 6px}
  .hint{font-size:13px;color:#6F7685;margin:0 0 14px}
  #drop{border:2px dashed #2C61FE;border-radius:10px;padding:26px;text-align:center;color:#2C61FE;cursor:pointer;background:#EAF0FF}
  #drop.over{background:#D6E2FF}
  img#prev{max-width:100%;max-height:360px;display:block;margin:12px auto;border-radius:8px;border:1px solid #DADFE6}
  textarea,select{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #DADFE6;border-radius:8px;margin-top:10px}
  button{font:inherit;font-weight:700;background:#2C61FE;color:#fff;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin-top:12px;width:100%}
  button:disabled{opacity:.5}
  .badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;margin-right:6px}
  .answer{background:#E6F7F0;color:#1BA672}.ask{background:#FFF4E5;color:#E8890C}.unknown{background:#F0F2F5;color:#6F7685}
  .model{background:#EAF0FF;color:#2C61FE}.rules{background:#F0F2F5;color:#6F7685}
  .entry h2{font-size:17px;margin:12px 0 4px}.why{color:#6F7685;font-size:14px}
  ol{padding-left:20px;line-height:1.5}
  .fb{font-size:14px;background:#FFF4E5;padding:10px;border-radius:8px}
  .cand{display:block;width:100%;text-align:left;background:#fff;color:#121826;border:1px solid #2C61FE;margin-top:8px}
  pre{background:#F7F8FA;border-radius:8px;padding:10px;font-size:12px;overflow:auto;max-height:260px}
  .src{font-size:12px;color:#8592A6}
  @media(max-width:760px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>输入</h1>
    <p class="hint">拖一张截图进来，或点击选择；也可以只打一句话。手机截图用隔空投送发到电脑再拖进来即可。</p>
    <div id="drop">拖放或点击选择截图</div>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="prev" hidden>
    <textarea id="text" rows="2" placeholder="可选：用户的一句话，例如 Alipay says my card verification failed"></textarea>
    <select id="lang"><option value="en">en</option><option value="ja">ja</option><option value="ko">ko</option><option value="zh-Hant">zh-Hant</option></select>
    <label style="font-size:13px;display:block;margin-top:8px"><input type="checkbox" id="advice" checked> 未知时允许 AI 生成建议（标注未经核验）</label>
    <button id="go">识别</button>
  </section>
  <section class="card">
    <h1>结果</h1>
    <p class="hint" id="meta">还没有请求</p>
    <div id="out"></div>
    <details style="margin-top:12px"><summary class="src">原始 JSON</summary><pre id="raw"></pre></details>
  </section>
</main>
<script>
const $=s=>document.querySelector(s); let file=null;
const drop=$('#drop'), inp=$('#file');
drop.onclick=()=>inp.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');setFile(e.dataTransfer.files[0])};
inp.onchange=()=>setFile(inp.files[0]);
document.onpaste=e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(it)setFile(it.getAsFile())};
function setFile(f){if(!f)return;file=f;const img=$('#prev');img.src=URL.createObjectURL(f);img.hidden=false;drop.textContent=f.name+' · '+Math.round(f.size/1024)+' KB'}
function render(d){
  const out=$('#out'); const dec={answer:'直接给答案',ask:'让用户确认',unknown:'未知'}[d.decision];
  $('#meta').textContent=`${d.latency_ms} ms · 场景 ${d.scenario} · 置信度 ${d.confidence}`;
  let h=`<span class="badge ${d.decision}">${dec}</span><span class="badge ${d.mode}">${d.mode==='model'?'模型':'规则兜底'}</span>`;
  if(d.ocr_text) h+=`<p class="src">识别到的文字：${d.ocr_text}</p>`;
  if(d.entry){const e=d.entry;h+=`<div class="entry"><h2>${e.title}</h2><p class="why">${e.why}</p><ol>${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="fb"><b>Still stuck:</b> ${e.fallback}</div><p class="src">${e.id} · verified ${e.verified_at} · ${e.sources.map(s=>`<a href="${s.url}" target="_blank">${s.name}</a>`).join(' · ')}</p></div>`}
  if(d.candidates&&d.candidates.length){h+=`<p>你卡在哪一步？</p>`+d.candidates.map(c=>`<button class="cand" data-id="${c.entry_id}">${c.title} <span class="src">(${c.confidence})</span></button>`).join('')}
  if(d.advice){h+=`<div class="fb"><b>AI 建议（未经核验）：</b> ${d.advice}</div>`}
  if(d.decision==='unknown'&&!d.advice){h+=`<p class="why">知识库没有覆盖这个场景。</p>`}
  out.innerHTML=h; $('#raw').textContent=JSON.stringify(d,null,2);
  out.querySelectorAll('.cand').forEach(b=>b.onclick=async()=>{const r=await fetch(`/kb/entry/${b.dataset.id}?lang=${$('#lang').value}`);render({...d,decision:'answer',entry:await r.json(),candidates:[],advice:null})});
}
$('#go').onclick=async()=>{
  if(!file&&!$('#text').value.trim()){alert('先给一张截图或一句话');return}
  const fd=new FormData(); if(file)fd.append('image',file); fd.append('text',$('#text').value); fd.append('lang',$('#lang').value); fd.append('advice',$('#advice').checked?'true':'false');
  $('#go').disabled=true;$('#meta').textContent='识别中…';
  try{const r=await fetch('/stuck/classify',{method:'POST',body:fd});render(await r.json())}catch(e){$('#meta').textContent='请求失败：'+e}
  $('#go').disabled=false;
};
</script>
</body>
</html>
