<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Check 流程演示</title>
<style>
  :root{--brand:#2C61FE;--text:#121826;--text2:#6F7685;--line:#DADFE6;--bg:#F0F2F5;--warn:#E8890C}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:700}
  header h1 span{color:var(--brand)}
  header .hint{font-size:12px;color:var(--text2)}
  main{display:grid;grid-template-columns:420px 1fr;gap:32px;max-width:1100px;margin:28px auto;padding:0 28px}
  .phone{position:relative;width:393px;margin:0 auto;border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(18,24,38,.25);background:#000;aspect-ratio:393/852}
  .phone img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .18s}
  .phone img.fade{opacity:0}
  .hot{position:absolute;border:2px solid var(--brand);border-radius:10px;cursor:pointer;background:rgba(44,97,254,.06);animation:pulse 1.4s ease-in-out infinite}
  .hot::after{content:"点这里";position:absolute;right:-2px;top:-24px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap}
  .hot.up::after{top:auto;bottom:-24px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(44,97,254,.45)}50%{box-shadow:0 0 0 8px rgba(44,97,254,0)}}
  .panel{background:#fff;border-radius:16px;border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;min-height:560px}
  .steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .steps b{width:28px;height:28px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer}
  .steps b.on{background:var(--brand);color:#fff}
  .steps b.done{background:#EAF0FF;color:var(--brand)}
  .stage{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
  h2{font-size:26px;margin:6px 0 12px;line-height:1.25}
  .desc{font-size:15px;line-height:1.7;color:var(--text2);margin:0 0 18px}
  .box{border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6;margin-bottom:12px}
  .box.do{background:#EAF0FF;color:#1136A6}
  .box.do b{color:var(--brand)}
  .box.why{background:var(--bg);color:var(--text)}
  .box.why b{display:block;margin-bottom:2px}
  .nav{margin-top:auto;display:flex;gap:10px;padding-top:18px}
  button{font:inherit;font-weight:700;font-size:15px;border-radius:6px;padding:12px 18px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;flex:1}
  button:disabled{opacity:.4;cursor:default}
  @media (max-width:900px){main{grid-template-columns:1fr}.phone{width:100%;max-width:393px}}
</style>
</head>
<body>
<header>
  <h1>Trip.com <span>Landing Check</span> · 流程演示</h1>
  <div class="hint">键盘 ← → 切换步骤 · 点手机上的高亮区域推进</div>
</header>
<main>
  <div class="phone" id="phone"><img id="shot" src="" alt=""></div>
  <section class="panel">
    <div class="steps" id="dots"></div>
    <div class="stage" id="stage"></div>
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>
    <div class="box do" id="do"></div>
    <div class="box why" id="why"></div>
    <div class="nav">
      <button id="prev">上一步</button>
      <button class="primary" id="next">下一步</button>
    </div>
  </section>
</main>

let i = 0;
const $ = id => document.getElementById(id);
function render(){
  const s = STEPS[i];
  const img = $('shot'); img.classList.add('fade');
  setTimeout(()=>{ img.src = IMG(s.img); img.onload = () => img.classList.remove('fade'); }, 120);
  $('stage').textContent = `第 ${i+1} 步 / 共 ${STEPS.length} 步 · ${s.stage}`;
  $('title').textContent = s.title;
  $('desc').textContent = s.desc;
  $('do').innerHTML = '用户操作：' + s.do;
  $('why').innerHTML = s.why;
  $('prev').disabled = i === 0;
  $('next').textContent = i === STEPS.length-1 ? '回到开头' : '下一步';
  document.querySelectorAll('.hot').forEach(h=>h.remove());
  if (s.hot){
    const h = document.createElement('div'); h.className = 'hot' + (s.up ? ' up' : '');
    const [l,t,w,hh] = s.hot; h.style.cssText = `left:${l}%;top:${t}%;width:${w}%;height:${hh}%`;
    h.onclick = next; $('phone').appendChild(h);
  }
  $('dots').innerHTML = STEPS.map((_,k)=>`<b class="${k===i?'on':k<i?'done':''}" data-k="${k}">${k+1}</b>`).join('');
  document.querySelectorAll('#dots b').forEach(b=>b.onclick=()=>{i=+b.dataset.k;render();});
}
function next(){ i = (i+1) % STEPS.length; render(); }
function prev(){ if (i>0){ i--; render(); } }
$('next').onclick = next; $('prev').onclick = prev;
document.addEventListener('keydown', e => { if (e.key==='ArrowRight'||e.key===' ') next(); if (e.key==='ArrowLeft') prev(); });
STEPS.forEach(s => { const im = new Image(); im.src = IMG(s.img); });
render();
</script>
</body>
</html>
