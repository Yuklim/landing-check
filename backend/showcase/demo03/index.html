<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Check · 03 Demo</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="player.css">
  <style>
    :root{--blue:#2454ed;--blue-soft:#eaf0ff;--ink:#18202e;--muted:#626b79;--line:#e3e7ee;--font:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"SFMono-Regular",Consolas,monospace}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:var(--font);color:var(--ink);background:radial-gradient(130% 120% at 50% 0%,#15245a 0%,#0a1430 60%,#070d20 100%);overflow:hidden;-webkit-font-smoothing:antialiased}
    .root{position:fixed;inset:0;display:grid;place-items:center}
    .stage{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform-origin:center;background:linear-gradient(120deg,#f3f7ff 0%,#fff 70%);overflow:hidden}

    /* 顶部：章节 + 五个模块 */
    .top{position:absolute;left:84px;right:84px;top:38px;display:flex;align-items:center;gap:22px}
    .kicker{font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:12px;white-space:nowrap}
    .kicker::before{content:"";width:26px;height:2px;background:var(--blue)}
    .tabs{display:flex;gap:10px;flex:1}
    .tab{flex:1;border:0;background:none;font:600 16px var(--font);color:#9aa3b2;text-align:left;padding:0 0 10px;cursor:pointer;position:relative;white-space:nowrap}
    .tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:#dfe5f0}
    .tab .bar{position:absolute;left:0;bottom:0;height:4px;border-radius:2px;background:var(--blue);width:0;z-index:1}
    .tab[aria-selected=true]{color:var(--ink)}
    .tab .n{font-family:var(--mono);font-size:13px;color:var(--blue);margin-right:8px}

    .phone-area{position:absolute;left:84px;top:104px;width:430px;height:676px}

    /* 右侧讲解 */
    .cp{position:absolute;left:600px;right:84px;top:118px;bottom:44px;display:flex;flex-direction:column}
    .cp-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .cp-fn{display:flex;align-items:baseline;gap:14px;font-size:22px;font-weight:700;letter-spacing:-.3px}
    .cp-fn .n{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--blue);letter-spacing:.08em}
    .cp-need{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);white-space:nowrap}
    .cp-need b{color:var(--ink);font-weight:650}
    .cp-meter{width:96px;height:6px;border-radius:3px;background:#e4e9f2;overflow:hidden}
    .cp-meter i{display:block;height:100%;border-radius:3px;background:var(--blue)}
    .cp-pct{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--blue)}
    .cp-title{margin:26px 0 26px;font-size:42px;line-height:1.22;letter-spacing:-1.2px;font-weight:760}
    .cp-title em{font-style:normal;color:var(--blue)}

    .cp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
    .cp-item{position:relative;display:grid;grid-template-columns:40px 1fr;gap:16px;align-items:start;padding:16px 22px 16px 18px;border-radius:16px;border:1px solid transparent;opacity:.42;transition:opacity .35s,background-color .35s,box-shadow .35s,border-color .35s}
    .cp-item::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:2px;background:var(--blue);transform:scaleY(0);transition:transform .35s}
    .cp-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--mono);color:var(--blue);background:var(--blue-soft);margin-top:1px;transition:background-color .35s,color .35s}
    .cp-item b{display:block;font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
    .cp-item p{margin:4px 0 0;font-size:16.5px;line-height:1.5;color:var(--muted)}
    .cp-item.done{opacity:.72}
    .cp-item.done .cp-dot{background:var(--blue-soft);color:var(--blue);font-size:0}
    .cp-item.done .cp-dot::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:translateY(-2px) rotate(-45deg)}
    .cp-item.on{opacity:1;background:#fff;border-color:#dbe4fb;box-shadow:0 10px 30px -12px rgba(36,84,237,.28)}
    .cp-item.on::before{transform:scaleY(1)}
    .cp-item.on .cp-dot{background:var(--blue);color:#fff}

    .cp-note{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;color:#8a93a3}
    .cp-note::before{content:"";width:6px;height:6px;border-radius:50%;background:#b8c4dc}

    .ctl{position:fixed;right:16px;bottom:14px;color:#b9c6e6;font:500 12px var(--mono);opacity:.7}
  </style>
</head>
<body>
  <div class="root"><div class="stage" id="stage">
    <div class="top"><div class="kicker">03 / 落地体验</div><div class="tabs" id="tabs"></div></div>
    <div class="phone-area" id="phoneArea"></div>
    <div class="cp" id="copy"></div>
  </div></div>
  <div class="ctl">← → 切模块 · 空格 暂停 · ?m=模块&amp;t=秒 定格</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="player.js"></script>
  <script src="copy.js"></script>
  <!-- 顺序即演示顺序：门票与预约 → 上网与通讯 → 支付 → 交通 → 落地与机场（总结） -->
  <script src="modules/tickets/timeline.js"></script>
  <script src="modules/network/timeline.js"></script>
  <script src="modules/payment/timeline.js"></script>
  <script src="modules/transport/timeline.js"></script>
  <script src="modules/airport/timeline.js"></script>
  <script>
  (function () {
    const ORDER = ['tickets', 'network', 'payment', 'transport', 'airport'];
    const COPY = window.DEMO03_COPY;
    const MAX_PCT = 38.4;   // 需求热度最高的一项，进度条按它归一
    const stage = document.getElementById('stage'), area = document.getElementById('phoneArea'), tabs = document.getElementById('tabs'), copy = document.getElementById('copy');
    const fit = () => { const s = Math.min(innerWidth / 1440, innerHeight / 810); stage.style.transform = `translate(-50%,-50%) scale(${s})`; };
    fit(); addEventListener('resize', fit);
    const q = new URLSearchParams(location.search);
    let idx = Math.max(0, ORDER.indexOf(q.get('m'))), player = null;
    const pad = i => String(i + 1).padStart(2, '0');

    ORDER.forEach((k, i) => {
      const b = document.createElement('button'); b.className = 'tab';
      b.innerHTML = `<span class="n">${pad(i)}</span>${COPY[k].fn}<span class="bar"></span>`;
      b.onclick = () => go(i); tabs.appendChild(b);
    });

    function renderCopy(key, i) {
      const c = COPY[key];
      copy.innerHTML = `
        <div class="cp-head">
          <div class="cp-fn"><span class="n">${pad(i)}</span>${c.fn}</div>
          <div class="cp-need">回应需求 <b>${c.need}</b><span class="cp-meter"><i style="width:${(c.pct / MAX_PCT * 100).toFixed(1)}%"></i></span><span class="cp-pct">${c.pct}%</span></div>
        </div>
        <h2 class="cp-title">${c.title}</h2>
        <ol class="cp-list">${c.items.map((it, j) => `<li class="cp-item"><span class="cp-dot">${j + 1}</span><div><b>${it.t}</b><p>${it.d}</p></div></li>`).join('')}</ol>
        <div class="cp-note">${c.note}</div>`;
      gsap.from(copy.children, { y: 14, autoAlpha: 0, duration: 0.5, stagger: 0.06, ease: 'power2.out' });
      return [...copy.querySelectorAll('.cp-item')];
    }

    // 播放到哪一拍，就点亮对应要点；之前的打勾，之后的变淡
    function syncer(key, items, p) {
      const byLabel = {};
      COPY[key].items.forEach((it, j) => it.beats.forEach(l => { byLabel[l] = j; }));
      const beats = p.beats.filter(b => b.label in byLabel).sort((a, b) => a.t - b.t);
      let last = -2;
      return () => {
        const now = p.tl.time() + 0.05;
        let on = 0;
        beats.forEach(b => { if (b.t <= now) on = byLabel[b.label]; });
        if (on === last) return; last = on;
        items.forEach((li, j) => { li.classList.toggle('on', j === on); li.classList.toggle('done', j < on); });
      };
    }

    function go(i) {
      idx = (i + ORDER.length) % ORDER.length;
      [...tabs.children].forEach((b, j) => { b.setAttribute('aria-selected', j === idx); b.querySelector('.bar').style.width = '0'; });
      if (player) player.destroy();
      const key = ORDER[idx];
      const items = renderCopy(key, idx);
      if (!Demo03.modules[key]) { area.innerHTML = '<div style="height:100%;display:grid;place-items:center;color:#9aa6bd">模块制作中：' + key + '</div>'; player = null; return; }
      player = Demo03.build(area, key);
      const bar = tabs.children[idx].querySelector('.bar');
      const sync = syncer(key, items, player);
      player.tl.eventCallback('onUpdate', () => { bar.style.width = (player.tl.progress() * 100) + '%'; sync(); });
      window.__d3 = player;
      const t = q.get('t');
      if (t != null && q.get('m') === key) { player.tl.seek(+t); player.tl.pause(); sync(); bar.style.width = (player.tl.progress() * 100) + '%'; } else { sync(); player.play(); }
    }
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(idx + 1);
      else if (e.key === 'ArrowLeft') go(idx - 1);
      else if (e.key === ' ' && player) { e.preventDefault(); player.tl.paused() ? player.tl.play() : player.tl.pause(); }
    });
    go(idx);
  })();
  </script>
</body>
</html>
