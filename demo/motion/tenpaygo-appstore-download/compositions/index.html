  Mounted by ../index.html (host "tenpaygo-store", data-start 0), so every time
  here is absolute shot time. All UI is drawn in HTML/CSS/inline SVG: no
  images, no Apple logo, no App Store wordmark/badge, no Tencent icon artwork.
  Colours: only var(--tpg-*) tokens, defined once in ../index.html :root.
  Layout: shot-plan.json content.layout boxes ([x,y,w,h] px on the stage).
  Timeline: one paused GSAP timeline, window.__timelines["tenpaygo-store"].
  Every tween is a fromTo with explicit endpoints; the earliest tween per
  element keeps immediateRender (its from-state equals the CSS state), every
  later one sets immediateRender:false. No callback drives a visual: typing is
  per-letter display sets generated from TYPE_SEQ, so each frame is a pure
  function of t on every seek path. Loop: 7.95-8.00 == frame 0.
  The touch discs and the download ring are registry components mounted by
  the root; this file owns the target reactions at touch-down 0.70 and 4.00.
-->
